name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.12.3"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install toolchain and WebView libraries
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test

  bundle:
    name: bundle ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - name: Install Linux WebView libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build the ferry CLI sidecar
        shell: bash
        run: |
          cargo build --release -p ferry-cli --target ${{ matrix.target }}
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p app/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/ferry${ext}" "app/src-tauri/binaries/ferry-${{ matrix.target }}${ext}"

      # Signing and notarization run only when the Apple secrets exist
      # (docs/release.md); without them the macOS build is ad-hoc signed.
      - name: Bundle the desktop app
        shell: bash
        working-directory: app/src-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          fi
          # The Tauri CLI treats a variable that is set but empty as configured.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            if [ "${{ runner.os }}" != "macOS" ] || [ -z "${!name}" ]; then unset "$name"; fi
          done
          unset APPLE_API_KEY_P8
          if [ "${{ runner.os }}" = "macOS" ] && [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::notice::No Apple signing certificate configured; the macOS build is ad-hoc signed."
          fi
          npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --target ${{ matrix.target }} --config tauri.release.conf.json

      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
          NOTARIZED: ${{ secrets.APPLE_ID != '' || secrets.APPLE_API_KEY != '' }}
        run: |
          app=$(find "target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$SIGNED" = "true" ]; then
            codesign -dv --verbose=4 "$app" 2>&1 | grep -q "Authority=Developer ID Application"
            if [ "$NOTARIZED" = "true" ]; then
              xcrun stapler validate "$app"
              spctl --assess --type execute --verbose=2 "$app"
            fi
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ferry-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --prerelease
